[package]
name = "openjp2-cli"
version = "0.7.0"
edition = "2021"
license = "BSD-2-Clause"
description = "Command-line tools for the pure-Rust OpenJPEG port (openjp2)"
repository = "https://github.com/Neopallium/openjp2"
keywords = ["j2k", "jp2", "jpeg2000", "image", "cli"]
publish = false

[[bin]]
name = "openjp2-cli"
path = "src/main.rs"

[dependencies]
openjp2 = { path = ".." }
clap = { version = "4.6", features = ["derive"] }
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "tiff",
  "pnm",
  "bmp",
  "tga",
  "webp",
] }
env_logger = "0.11"
