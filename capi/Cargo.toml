[package]
name = "openjp2-capi"
authors = ["Robert G. Jakabosky <rjakabosky+neopallium@neoawareness.com>"]
version = "0.7.0"
license = "BSD-2-Clause"
description = "C ABI for the Rust port of Openjpeg."
repository = "https://github.com/Neopallium/openjp2"
homepage = "https://github.com/Neopallium/openjp2"
documentation = "https://docs.rs/openjp2"
keywords = ["j2k", "jp2", "jpeg2000", "image"]
edition = "2018"
autobins = false

exclude = ["CMakeLists.txt"]

[workspace]

[lib]
# The library name must stay `openjp2` so CMake finds `libopenjp2.a`.
name = "openjp2"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# File-based streams and the FILE* dump writer need libc.  Disable for
# no_std targets like WASM; custom (callback) streams still work.
default = ["file-io"]
file-io = ["dep:libc"]
# Pass-through: write the upstream OpenJPEG product/version string into
# the default codestream comment (off by default).
openjpeg-version-string = ["openjp2_core/openjpeg-version-string"]
simd = ["openjp2_core/simd"]

[dependencies]
openjp2_core = { package = "openjp2", path = "..", features = ["event-handlers"] }
openjp2-ctypes = { path = "../ctypes" }
libc = { version = "0.2", optional = true }
log = "0.4.17"
