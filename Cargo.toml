[package]
name = "openjp2"
authors = ["Robert G. Jakabosky <rjakabosky+neopallium@neoawareness.com>"]
version = "0.7.0"
license = "BSD-2-Clause"
description = "Rust port of Openjpeg."
repository = "https://github.com/Neopallium/openjp2"
documentation = "https://docs.rs/openjp2"
keywords = ["j2k", "jp2", "jpeg2000", "image"]
edition = "2018"
autobins = false

exclude = [
  # the C reference project, its build dir and the test data
  "openjpeg/*",
  # sub-crates with their own packages / publish settings
  "capi/*",
  "ctypes/*",
  "tools/*",
  "libtiff-sys/*",
  "fuzz/*",
  "wasm/*",
  "cli/*",
  # dev/CI-only files (kept in the repository, not in the crate)
  "examples/*",
  "scripts/*",
  ".github/*",
  # dev/test data (the docs use doc/example.jp2 instead)
  "samples/*",
]

[workspace]
members = ["tools", "libtiff-sys", "ctypes", "cli"]
# v2 keeps feature resolution per build unit: `default-features = false`
# on the openjp2 dependency (e.g. for no-rayon platforms) is honored
# instead of being polluted by this package's own default features.
resolver = "2"

[lib]
name = "openjp2"
crate-type = ["rlib"]

[dependencies]
openjp2-ctypes = { path = "ctypes", version = "0.7.0" }
rayon = { version = "1.11", optional = true }
image = { version = "0.25.9", default-features = false, optional = true }
bitflags = "1.3.2"
byteorder = { version = "1.5" }
log = "0.4.17"

smallvec = "1.13"
wide = { version = "1.7", optional = true }
serde = { version = "1", optional = true }

[features]
# Parallelism via rayon is optional: some platforms/targets cannot use
# rayon.  The code falls back to sequential iterators without it.
default = ["rayon", "image"]
rayon = ["dep:rayon"]
# C-style event callbacks (opj_set_info_handler etc. via Decoder/Encoder):
# the C-ABI crate enables this; the stable Rust API routes diagnostics
# through the `log` crate instead.
event-handlers = []
# jpeg2k-compatible alias for the rayon feature.
threads = ["rayon"]
# `image`-crate interop (Image::get_pixels / DynamicImage conversion).
image = ["dep:image"]
# Serialization support for the safe-API types (ImageData /
# ImagePixelData when the image feature is on, plus DecodeArea,
# DecodeLimits, ColorSpace and ProgressionOrder).  Forwards to the image
# crate's own serde support so the pixel-format field derives too.
serde = ["dep:serde", "image?/serde"]
# Write the upstream OpenJPEG product/version string into the default
# codestream comment (COM marker) instead of the port's own name and
# version, so encoded files are byte-identical to the C reference.
# Off by default; the test suite enables it where needed.
openjpeg-version-string = []
# SIMD-accelerated DWT kernels via the `wide` crate (safe API; the
# kernels run on the generic build without it).  Off by default.
simd = ["dep:wide"]

[dev-dependencies]
serde_json = "1"
