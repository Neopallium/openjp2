[package]
name = "openjp2-wasm"
authors = ["Robert G. Jakabosky <rjakabosky+neopallium@neoawareness.com>"]
version = "0.7.0"
license = "BSD-2-Clause"
description = "WASM bindings for the pure-Rust OpenJPEG port (openjp2)."
repository = "https://github.com/Neopallium/openjp2"
documentation = "https://docs.rs/openjp2-wasm"
keywords = ["j2k", "jp2", "jpeg2000", "image", "wasm"]
edition = "2021"
autobins = false

exclude = ["examples/*"]

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openjp2 = { path = "..", default-features = false }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
wasm-bindgen-rayon = { version = "1.3", optional = true }
rayon = { version = "1.11", optional = true }
js-sys = { version = "0.3", optional = true }

[features]
# WebAssembly threads (SharedArrayBuffer + cross-origin isolation) with a
# rayon worker pool.  Requires the nightly atomics build; see
# playground/build.sh --threads.
threads = ["dep:wasm-bindgen-rayon", "dep:js-sys", "dep:rayon", "openjp2/threads"]
