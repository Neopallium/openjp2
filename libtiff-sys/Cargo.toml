[package]
name = "libtiff-sys"
version = "0.1.0"
edition = "2021"
publish = false
links = "tiff"
description = "Low-level Rust bindings for libTIFF"
license = "MIT"

# Enable build scripts
build = "build.rs"

[build-dependencies]
bindgen = "0.69"
pkg-config = "0.3"

[[bin]]
name = "tiffinfo"
path = "src/bin/tiffinfo.rs"
